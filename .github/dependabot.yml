# DD-BL-36. Dependabot config lives in the repo so the policy is reviewable
# and versioned; the *alerts* toggle is a repo setting and has to be flipped
# once by hand (see drydock-backlog.md).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      # Weekly, not daily: DryDock has one maintainer, and a daily PR
      # stream is how a security-update habit dies. Vercel pre-announces
      # each Next.js security batch about a week ahead, so a weekly sweep
      # never lags a batch by more than a few days.
      interval: "weekly"
      day: "monday"
    # 3, not 5. The five PRs of 2026-07-27 sat untouched for nine days and
    # hit this cap exactly — which also means further bumps were being
    # suppressed behind it. A lower cap makes a stalled queue visible as a
    # stalled queue instead of letting it masquerade as a full one.
    open-pull-requests-limit: 3
    # Malicious npm versions are usually caught and unpublished within
    # hours-to-days. Waiting 3 days before proposing an upgrade puts the
    # community's detection window in front of this repo — the single
    # highest-leverage setting per vibe-coding-security's npm-hardening.
    cooldown:
      default-days: 3
    # Three groups, not one. The original config grouped only dev
    # minor/patch, which on 2026-07-27 caught 2 of 6 bumps and let the
    # other four open as singletons: react-dom (production), nanoid
    # (production + major), @types/node and vitest (dev, but major).
    # `applies-to: version-updates` is the default and is stated
    # explicitly here so the "security updates stay ungrouped" intent
    # below is enforced by the file rather than by the default.
    groups:
      production-dependencies:
        applies-to: version-updates
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-dependencies:
        applies-to: version-updates
        dependency-type: "development"
        update-types: ["minor", "patch"]
      # Majors arrive together on purpose. Grouped, they are one PR that
      # gets read and validated as a unit; ungrouped, they are N PRs that
      # each need their own upgrade decision and so get none — which is
      # exactly how three majors sat open for nine days. The tradeoff is
      # real: a grouped major PR that breaks is harder to attribute, so
      # bisect by dropping one line from package.json and reinstalling.
      major-upgrades:
        applies-to: version-updates
        update-types: ["major"]
    # Security upgrades are deliberately NOT grouped — those want their
    # own reviewable PR, which the `applies-to` fields above guarantee.
    ignore:
      # `next` is exact-pinned on purpose (DD-016): security batches are a
      # deliberate upgrade with a full test + build + auth re-verification,
      # not a version bump that rides in with the weekly noise. Dependabot
      # *alerts* still surface Next.js CVEs; this only stops it from
      # opening routine version PRs.
      - dependency-name: "next"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      # `eslint-config-next` ships in lockstep with `next` and must track it.
      # Without this, the majors group swept it to 16.2.12 against a `next`
      # pinned at 15.x (PR #20) — a pairing that is wrong by construction.
      # Ignoring `next` alone was not enough: the sibling has to be ignored
      # on the same terms, or the pin leaks.
      - dependency-name: "eslint-config-next"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
